import net.fabricmc.loom.api.RemapConfigurationSettings

plugins {
    id 'java-library'
    alias libs.plugins.fabric.loom
    id 'maven-publish'
    alias libs.plugins.lombok
    alias libs.plugins.spotless
    alias libs.plugins.modmuss50.publish
}

def targetJavaVersion = 21
def local = !System.getenv().containsKey("GITHUB_RUN_NUMBER");

group = project.maven_group
version = "${project.mod_version}-${project.minecraft_version}-${local ? 'SNAPSHOT' : "build.${System.getenv("GITHUB_RUN_NUMBER")}"}"

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    addRemapConfiguration("testmodRemapImplementation", (RemapConfigurationSettings configuration) -> {
        configuration.getTargetConfigurationName().convention("testmodImplementation")
        configuration.getSourceSet().convention(sourceSets.testmod)
        configuration.getOnCompileClasspath().convention(true)
        configuration.getOnRuntimeClasspath().convention(true)
        configuration.getPublishingMode().convention(RemapConfigurationSettings.PublishingMode.NONE)
    })
}

configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent(libs.mockito.core) {
        transitive = false
    }

    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader

    modImplementation libs.fabric.api

    testmodImplementation sourceSets.main.output
    testmodImplementation libs.assertj.core

    testImplementation("net.fabricmc:fabric-loader-junit:${libs.fabric.loader.get().version}") {
        exclude(group: "org.junit")
        exclude(group: "org.junit.jupiter")
    }
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation sourceSets.testmod.output
    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
}

tasks {
    test {
        useJUnitPlatform()
        doFirst {
            jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", "-Xshare:off"]
        }
    }
}

def cleanMcVersion = project.minecraft_version.replace('.', '_')

loom {
    accessWidenerPath = file("${getRootProject().projectDir.absolutePath}/src/main/resources/pulsar.accesswidener")

    runs {
        server {
            runDir "run/%s/server".formatted(cleanMcVersion)
        }
        client {
            runDir "run/%s/client".formatted(cleanMcVersion)
        }
        testmod {
            server()
            name = "Testmod"
            source sourceSets.testmod
            runDir "run/%s/testmod_server".formatted(cleanMcVersion)
        }
        testmodClient {
            client()
            name = "Testmod Client"
            source sourceSets.testmod
            runDir "run/%s/testmod_client".formatted(cleanMcVersion)
        }
        gametest {
            inherit testmod

            name "Game Test"

            // Enable the gametest runner
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest/%s".formatted(cleanMcVersion)
        }
        autotest {
            inherit(testmod)
            properties([
                    "mixin.debug.export": "true",
                    "pulsar.auto-test": "true"
            ])
            runDir "build/autotest/%s_server".formatted(cleanMcVersion)
        }
        autotestClient {
            inherit(testmodClient)
            properties([
                    "mixin.debug.export": "true",
                    "pulsar.auto-test": "true"
            ])
            runDir "build/autotest/%s_client".formatted(cleanMcVersion)
        }
    }

    mods {
        register(project.name) {
            sourceSet project.sourceSets.main
        }

        register(project.name + "-testmod") {
            sourceSet project.sourceSets.testmod
        }
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

sourcesJar {
    exclude {
        sourceSets.main.allSource.contains it.file
    }
    from delombok
}

spotless {
    java {
        removeUnusedImports()
        palantirJavaFormat('2.91.0').style("GOOGLE")
        trimTrailingWhitespace()
        formatAnnotations()
    }
}

processResources {
    def map = [
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": libs.fabric.loader.get().version,
            "fabric_version": libs.fabric.api.get().version
    ]
    inputs.properties(map)
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand map
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    if (!local) {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/constellation-mc/pulsar"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

import me.modmuss50.mpp.ReleaseType

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(remapSourcesJar.archiveFile)

    changelog = file("CHANGELOG.md").text
    type = ReleaseType.valueOf(providers.environmentVariable("VERSION_TYPE").getOrElse("BETA"))
    modLoaders.add("fabric")

    displayName = "${project.mod_version} (${project.minecraft_version})"

    curseforge {
        projectId = "1391698"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")
    }
    modrinth {
        projectId = "FABvZJ1v"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")
    }
    github {
        repository = "constellation-mc/pulsar"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = providers.environmentVariable("GITHUB_SHA").getOrElse("${project.minecraft_version}-fabric")

        type = STABLE
    }

    dryRun = local
}
