[libraries]
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version = "0.19.2" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version = "0.150.0+26.1.2" }

junit-bom = { module = "org.junit:junit-bom", version = "5.11.4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.26.3" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version = "1.16.1" }
lombok = { id = "io.freefair.lombok", version = "9.5.0"}
spotless = { id = "com.diffplug.spotless", version = "8.4.0" }
modmuss50-publish = { id = "me.modmuss50.mod-publish-plugin", version = "1.1.0" }